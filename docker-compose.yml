version: '3.8'

services:
  health-monitor:
    build: .
    container_name: health_monitor
    # Ejecutar en foreground
    stdin_open: true
    tty: true
    # Para acceder a información del sistema host (necesario para psutil)
    privileged: true
    volumes:
      # Montar /sys para acceso a información del sistema
      - /sys:/sys:ro
      - /proc:/proc:ro
      - /dev:/dev:ro
    environment:
      # Variables de entorno si las necesita
      TZ: "America/Mexico_City"
    restart: unless-stopped
